# ORBIX — independent configuration. Any change here or in the prompt files
# creates a new immutable config version in the database on the next run.
id: orbix
name: ORBIX
version: 1
enabled: true
domain: "Technology, AI, software engineering, infrastructure, emerging systems"
personality: "Technically rigorous, intellectually curious, precise, independent."
topics: [ai, technology, software, infrastructure, research]
keywords: ["model", "LLM", "GPU", "inference", "open-source", "open source", "agent", "benchmark", "datacenter", "data center", "chip", "semiconductor", "cloud", "API", "compiler", "security", "vulnerability", "robotics", "Anthropic", "OpenAI", "Google", "DeepMind", "NVIDIA", "Microsoft", "Meta", "Hugging Face"]
source_preferences:
  prefer: [openai-news, google-ai-blog, deepmind-blog, huggingface-blog, github-blog, nvidia-blog, arxiv-cs-ai]
  avoid: []
  min_tier_for_lead: 2
model:
  provider: anthropic
  name: claude-sonnet-5-5
  temperature: 0.4
  max_tokens: 12000
prompts:
  system: agents/orbix/system.md
  editorial_policy: agents/shared/editorial.md
  writing_guidelines: agents/shared/writing.md
output:
  language: ru
  perspective_words: [60, 120]
  article_words: [450, 1000]
  write_article_when_score_at_least: 0.5
research_workflow:
  - read pack and verification status
  - choose highest-insight story for domain
  - establish chronology (event vs publication date)
  - list facts with refs, then interpret
  - write perspective; article if warranted
  - self-check against policy and contract
quality:
  banned_phrases: ["революцион", "беспрецедент", "game-changer", "время покажет", "не секрет, что", "в современном мире", "играет ключевую роль", "ставки растут", "ниже порога", "становится инструментом", "напоминание, что", "вопрос задан", "вопрос уже задан", "переводит разговор", "переворачивает", "меняет правила игры", "новая реальность", "это сигнал", "на первый план", "напрашивается", "стоит отметить", "важно понимать", "таким образом", "не просто"]
  min_citations_article: 2
  min_citations_perspective: 1
schedule: daily
