# TEMPO source registry.
# tier: 1 = original / authoritative (labs, institutions, regulators, journals)
#       2 = reputable newsroom
#       3 = aggregator / secondary
# Every feed is health-checked on each collection run; failures are recorded
# per provider (source_providers.last_status / last_error) and shown in Settings.
# Before adding a source, check its terms and robots.txt. The collector also
# checks robots.txt at runtime and skips disallowed feeds.

sources:
  # ---- Technology / AI (ORBIX) ----
  - { id: openai-news, name: OpenAI News, kind: rss, url: "https://openai.com/news/rss.xml", homepage: "https://openai.com/news", tier: 1, topics: [ai, technology] }
  - { id: google-ai-blog, name: Google — AI, kind: rss, url: "https://blog.google/technology/ai/rss/", homepage: "https://blog.google/technology/ai/", tier: 1, topics: [ai, technology] }
  - { id: deepmind-blog, name: Google DeepMind, kind: rss, url: "https://deepmind.google/blog/rss.xml", homepage: "https://deepmind.google/discover/blog/", tier: 1, topics: [ai, science] }
  - { id: huggingface-blog, name: Hugging Face Blog, kind: rss, url: "https://huggingface.co/blog/feed.xml", homepage: "https://huggingface.co/blog", tier: 1, topics: [ai, software] }
  - { id: github-blog, name: The GitHub Blog, kind: rss, url: "https://github.blog/feed/", homepage: "https://github.blog", tier: 1, topics: [software, technology] }
  - { id: nvidia-blog, name: NVIDIA Blog, kind: rss, url: "https://blogs.nvidia.com/feed/", homepage: "https://blogs.nvidia.com", tier: 1, topics: [ai, infrastructure] }
  - { id: arxiv-cs-ai, name: arXiv cs.AI, kind: rss, url: "https://rss.arxiv.org/rss/cs.AI", homepage: "https://arxiv.org/list/cs.AI/recent", tier: 1, topics: [ai, research] }
  - { id: mit-tech-review, name: MIT Technology Review, kind: rss, url: "https://www.technologyreview.com/feed/", homepage: "https://www.technologyreview.com", tier: 2, topics: [technology, ai] }
  - { id: ars-technica, name: Ars Technica, kind: rss, url: "https://feeds.arstechnica.com/arstechnica/index", homepage: "https://arstechnica.com", tier: 2, topics: [technology, science] }
  - { id: techcrunch, name: TechCrunch, kind: rss, url: "https://techcrunch.com/feed/", homepage: "https://techcrunch.com", tier: 2, topics: [technology, ai] }
  - { id: the-verge, name: The Verge, kind: rss, url: "https://www.theverge.com/rss/index.xml", homepage: "https://www.theverge.com", tier: 2, topics: [technology] }

